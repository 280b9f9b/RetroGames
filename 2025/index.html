<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1c1c1c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="apple-touch-icon" href="covers/icon.png">
    <link rel="icon" href="covers/icon.png" type="image/icon type">
    <title>RetroGames</title>
    <!-- Stylesheets -->
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1>RetroGames . . .</h1>
        <div id="controls">
            <input type="text" id="search" placeholder="Enter a keyword">&nbsp;&nbsp;
            <div class="totalgames" id="title-count"></div> <!-- Will display the total number of games -->
        </div>
        <div id="core-controls">
            <select id="core-filter">
                <option value="all">All platforms</option>
                <!-- Options will be dynamically generated by JavaScript -->
            </select>
            &nbsp;&nbsp;
            <select id="sort">
                <option value="title">Title</option>
                <option value="year">Year</option>
                <option value="platform">Platform</option>
                <option value="rating">Rating</option>
				<option value="players">Players</option>
            </select>
        </div>
    </header>
    <!-- Display container for games -->
    <div class="game-container" id="game-container"></div>
    <script src="script.js"></script> <!-- Assuming your JavaScript file is named script.js -->
</body>
</html>
